[package]
name = "iceoryx2async"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.45.1", features = ["full", "macros"] }
iceoryx2 = "0.7.0"
anyhow = "1.0.95"
zerocopy = { version = "0.8.26", features = ["derive", "simd"] }
gcloud-pubsub = "1.5.0"
gcloud-gax = "1.3.1"
google-cloud-googleapis = { package = "gcloud-googleapis", version = "1.2.0", features = [
  "pubsub",
] }
